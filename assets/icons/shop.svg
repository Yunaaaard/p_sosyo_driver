<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="wallGrad" x1="18" y1="36" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E6ECF5"/>
      <stop offset="100%" stop-color="#CBD5E4"/>
    </linearGradient>
    <linearGradient id="roofCapGrad" x1="16" y1="14" x2="80" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7676"/>
      <stop offset="100%" stop-color="#D92638"/>
    </linearGradient>
    <linearGradient id="redAwning" x1="0" y1="20" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="65%" stop-color="#EF303B"/>
      <stop offset="100%" stop-color="#C81E2B"/>
    </linearGradient>
    <linearGradient id="whiteAwning" x1="0" y1="20" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="25" y1="48" x2="43" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="49" y1="48" x2="73" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="12" y1="78" x2="84" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Soft Ground Shadow -->
  <ellipse cx="48" cy="85" rx="36" ry="4.5" fill="#0F172A" opacity="0.16"/>

  <!-- Storefront Wall -->
  <rect x="17" y="34" width="62" height="47" rx="6" fill="url(#wallGrad)"/>
  <!-- Under-Awning Wall Cast Shadow -->
  <rect x="17" y="39" width="62" height="7" fill="#0F172A" opacity="0.10"/>

  <!-- Door Frame & Door -->
  <rect x="25" y="48" width="18" height="32" rx="3.5" fill="url(#doorGrad)"/>
  <rect x="28" y="51.5" width="12" height="14" rx="2" fill="#DBEAFE" opacity="0.85"/>
  <circle cx="39.5" cy="69" r="1.5" fill="#FDE68A"/>

  <!-- Display Window -->
  <rect x="48" y="48" width="24" height="21" rx="3.5" fill="url(#windowGrad)"/>
  <path d="M50 49.5H59L52.5 67.5H50C49.45 67.5 49 67.05 49 66.5V50.5C49 49.95 49.45 49.5 50 49.5Z" fill="#FFFFFF" opacity="0.35"/>
  <!-- Window Sill -->
  <rect x="46.5" y="68" width="27" height="3.5" rx="1.75" fill="#94A3B8"/>

  <!-- Foundation Step -->
  <rect x="13" y="79" width="70" height="6" rx="3" fill="url(#baseGrad)"/>

  <!-- Top Roof Header Bar -->
  <rect x="18" y="14" width="60" height="8" rx="4" fill="url(#roofCapGrad)"/>

  <!-- 3D Striped Scalloped Awning (5 Stripes) -->
  <!-- Stripe 1 (Red Left) -->
  <path d="M18 20H30L28 36H12L18 20Z" fill="url(#redAwning)"/>
  <path d="M12 36C12 40.42 15.58 44 20 44C24.42 44 28 40.42 28 36H12Z" fill="#C81E2B"/>

  <!-- Stripe 2 (White) -->
  <path d="M30 20H42L41 36H28L30 20Z" fill="url(#whiteAwning)"/>
  <path d="M28 36C28 40.42 30.91 44 34.5 44C38.09 44 41 40.42 41 36H28Z" fill="#CBD5E1"/>

  <!-- Stripe 3 (Red Center) -->
  <path d="M42 20H54L55 36H41L42 20Z" fill="url(#redAwning)"/>
  <path d="M41 36C41 40.42 44.13 44 48 44C51.87 44 55 40.42 55 36H41Z" fill="#C81E2B"/>

  <!-- Stripe 4 (White) -->
  <path d="M54 20H66L68 36H55L54 20Z" fill="url(#whiteAwning)"/>
  <path d="M55 36C55 40.42 57.91 44 61.5 44C65.09 44 68 40.42 68 36H55Z" fill="#CBD5E1"/>

  <!-- Stripe 5 (Red Right) -->
  <path d="M66 20H78L84 36H68L66 20Z" fill="url(#redAwning)"/>
  <path d="M68 36C68 40.42 71.58 44 76 44C80.42 44 84 40.42 84 36H68Z" fill="#C81E2B"/>

  <!-- Awning Top Gloss -->
  <path d="M18 20H78L79.5 24H16.5L18 20Z" fill="#FFFFFF" opacity="0.24"/>
</svg>
