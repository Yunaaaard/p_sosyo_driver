<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="cargoGrad" x1="10" y1="14" x2="54" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CEBFF"/>
      <stop offset="48%" stop-color="#2294FF"/>
      <stop offset="100%" stop-color="#0F3DC9"/>
    </linearGradient>
    <linearGradient id="cargoTopHighlight" x1="28" y1="14" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8F5FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5CEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="58" y1="28" x2="88" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#74EEFF"/>
      <stop offset="55%" stop-color="#269BFF"/>
      <stop offset="100%" stop-color="#1356DC"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="64" y1="33" x2="84" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C2563"/>
      <stop offset="55%" stop-color="#1B4BA8"/>
      <stop offset="100%" stop-color="#388BFF"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0" y1="60" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B6678"/>
      <stop offset="55%" stop-color="#37404E"/>
      <stop offset="100%" stop-color="#1E242E"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="66" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCE5F2"/>
      <stop offset="100%" stop-color="#7F8FA8"/>
    </linearGradient>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="48" cy="83" rx="38" ry="5" fill="#0F172A" opacity="0.18"/>

  <!-- Cab Connector Shadow Seam -->
  <rect x="54" y="32" width="6" height="36" rx="2" fill="#0A2780"/>

  <!-- Cab Body -->
  <path d="M58 32C58 29.7909 59.7909 28 62 28H74.5C78.1 28 81.32 30.22 82.62 33.58L87.8 47.0C88.59 49.04 89 51.21 89 53.4V65C89 68.3137 86.3137 71 83 71H61C59.3431 71 58 69.6569 58 68V32Z" fill="url(#cabGrad)"/>
  <!-- Cab Top Highlight -->
  <path d="M60 31.5C60 30.12 61.12 29 62.5 29H74.2C77.1 29 79.7 30.8 80.75 33.5L81.5 35.5H60V31.5Z" fill="#B8F8FF" opacity="0.45"/>

  <!-- Cab Windshield -->
  <path d="M64 35.5C64 34.1193 65.1193 33 66.5 33H75.2C77.32 33 79.21 34.33 79.94 36.32L83.85 47.0C84.48 48.71 83.21 50.5 81.39 50.5H66.5C65.1193 50.5 64 49.3807 64 48V35.5Z" fill="url(#glassGrad)"/>
  <!-- Windshield Gloss Reflection -->
  <path d="M65.5 34.5H73.5L67.5 49H65.5C64.95 49 64.5 48.55 64.5 48V35.5C64.5 34.95 64.95 34.5 65.5 34.5Z" fill="#FFFFFF" opacity="0.22"/>

  <!-- Headlight -->
  <rect x="85" y="57" width="4" height="6" rx="2" fill="#E0F7FF" opacity="0.9"/>

  <!-- Cargo Box -->
  <rect x="7" y="14" width="50" height="57" rx="8" fill="url(#cargoGrad)"/>
  <!-- Cargo Top Specular Highlight -->
  <rect x="9" y="15.5" width="46" height="11" rx="6" fill="url(#cargoTopHighlight)"/>
  <!-- Cargo Bottom Depth -->
  <path d="M7 63H57V63C57 67.4183 53.4183 71 49 71H15C10.5817 71 7 67.4183 7 63V63Z" fill="#09258A" opacity="0.45"/>

  <!-- Rear Wheel -->
  <circle cx="27" cy="72" r="11.5" fill="url(#tireGrad)"/>
  <circle cx="27" cy="72" r="5.5" fill="url(#rimGrad)"/>

  <!-- Front Wheel -->
  <circle cx="73" cy="72" r="11.5" fill="url(#tireGrad)"/>
  <circle cx="73" cy="72" r="5.5" fill="url(#rimGrad)"/>
</svg>
